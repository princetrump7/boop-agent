name: Keep Alive

# Render free instances sleep after ~15 min with no inbound traffic, which
# kills long-polling bots. This pings the bot's URL so the instance stays
# awake. Telegram buffers updates for 24h, so even if a ping is delayed the
# bot picks up missed messages on its next poll.
#
# Cadence note (2026-08-23): Render suspended all free services on this account
# on Aug 22 (~750 instance-hrs/mo shared across services). Each ping wakes an
# instance for ~15 min, so cadence sets the burn: every 2h ≈ 93 hrs/mo/service.
# Every 5h ≈ 39 hrs/mo/service (~78 combined with alphavision-bot) — comfortably
# inside the pool even if bot message traffic adds extra awake time. Offset
# from alphavision's cron (23 */5) so GitHub's late-firing scheduler (observed
# 1.5–3.5h delays) never queues both at once. For TRUE always-on, move off the
# free tier: paid Starter or an Oracle Always Free VM.
#
# If you rename the Render service / subdomain, update BOT_URL below.

on:
  schedule:
    - cron: "47 */5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the Render instance
        env:
          BOT_URL: https://boop-agent-zp89.onrender.com/
        run: |
          curl -fsS --max-time 90 -o /dev/null \
            -w "alive: HTTP %{http_code} in %{time_total}s\n" \
            "$BOT_URL"
