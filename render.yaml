services:
  - type: web
    name: boop-agent
    env: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # ── Required ──
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AUTHORIZED_USER_ID
        sync: false
      - key: AUTHORIZED_USER_IDS
        sync: false
      - key: AUTHORIZED_CHAT_IDS
        sync: false
      # ── LLM Provider ──
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: openrouter/free
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      # Digest uses same LLM provider — no separate LLM vars needed
      # ── Digest / MTProto (optional but wired) ──
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: SESSION_B64
        sync: false
      - key: TELEGRAM_PHONE
        sync: false
      - key: TELEGRAM_SESSION_NAME
        value: tg_session
      - key: TIMEZONE
        value: Africa/Accra
      - key: DEFAULT_HOURS
        value: 24
      - key: AUTO_DIGEST_HOUR
        value: 8
      - key: MAX_CHATS
        value: 25
      - key: MAX_MESSAGES
        value: 800
      - key: CHUNK_CHARS
        value: 15000
      - key: MAX_MSG_CHARS
        value: 280
      # ── Overnight Trading (paper simulator — no keys required) ──
      - key: FINNHUB_API_KEY
        sync: false
      - key: PAPER_EQUITY
        value: 100000
      - key: SYMBOLS
        value: NVDA,AMD,AVGO,TSM,ASML,MU,MRVL,AMAT,LRCX,KLAC,INTC,ARM,SNDK,STX,WDC,CEG,VST,GEV,ETN,PWR,CCJ,NEE,XOM,CVX,COP,OKLO,SMR,BE,MSFT,GOOGL,AMZN,META,AAPL,ORCL,CRM,NOW,PANW,CRWD,PLTR,SNOW,DELL,ANET,VRT,HPE,JPM,GS,MS,BAC,WFC,BLK,BX,V,MA,PYPL,COIN
      - key: EQUITY_PER_TRADE_PCT
        value: 10
      - key: MAX_TOTAL_EXPOSURE_PCT
        value: 40
      - key: MAX_POSITIONS
        value: 4
      - key: DRY_RUN
        value: true
      - key: DB_PATH
        value: bot.db.json
      - key: ENTRY_MAX_MINUTES_TO_CLOSE
        value: 30
      - key: EXIT_MIN_MINUTES_TO_OPEN
        value: 10
      - key: EXIT_MAX_MINUTES_TO_OPEN
        value: 4320
      # ── Web Search ──
      - key: TAVILY_API_KEY
        sync: false
      - key: TALORDATA_API_KEY
        sync: false
      - key: WEB_SEARCH_PROVIDER
        value: talordata
      # Optional auth headers for private/login-gated links, e.g.
      # {"github.com": {"Authorization": "Bearer ghp_..."}}
      - key: WEB_FETCH_HEADERS
        sync: false
      # ── Convex (optional) ──
      - key: CONVEX_URL
        sync: false
      # ── folk engine (proactive accountability — all optional, sane defaults) ──
      - key: BRIEFING_HOUR
        value: 7
      - key: FOLLOWUP_MINUTES
        value: 120
      - key: FOLK_DB_PATH
        value: folk.db.json
      # Public base URL enables the /boop WebApp dashboard button.
      - key: PUBLIC_URL
        value: https://boop-agent.onrender.com
      # ── Bot Mode ──
      - key: BOT_MODE
        value: polling
      - key: LOG_LEVEL
        value: info
