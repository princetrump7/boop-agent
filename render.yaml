services:
  - type: web
    name: boop-agent
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # ── Required ──
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AUTHORIZED_USER_ID
        sync: false
      # ── LLM Provider ──
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: openrouter/free
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      # ── Web Search ──
      - key: TAVILY_API_KEY
        sync: false
      - key: TALORDATA_API_KEY
        sync: false
      - key: WEB_SEARCH_PROVIDER
        value: talordata
      # Optional auth headers for private/login-gated links, e.g.
      # {"github.com": {"Authorization": "Bearer ghp_..."}}
      - key: WEB_FETCH_HEADERS
        sync: false
      # ── Bot Mode ──
      - key: BOT_MODE
        value: polling
      - key: LOG_LEVEL
        value: info
